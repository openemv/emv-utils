name: CodeQL

on:
  push:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '15 4 20 * *'

env:
  TR31_VERSION: 0.6.6
  DUKPT_VERSION: 1.3.0

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 26.04", os: "ubuntu-26.04", ubuntu_release_name: "resolute", build_type: "Debug" }

    name: ${{ matrix.name }} build (CodeQL)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmbedtls-dev libxml2-dev libboost-locale-dev iso-codes libjson-c-dev libpcsclite-dev qt6-base-dev

    - name: Install DUKPT release
      # Use apt-get instead of dpkg to install the runtime dependencies of the dukpt package
      run: |
        gh release download --repo openemv/tr31 ${{ env.TR31_VERSION }} --pattern "tr31-${{ env.TR31_VERSION }}-${{ matrix.os }}.zip"
        gh release download --repo openemv/dukpt ${{ env.DUKPT_VERSION }} --pattern "dukpt-${{ env.DUKPT_VERSION }}-${{ matrix.os }}.zip"
        unzip tr31-${{ env.TR31_VERSION }}-${{ matrix.os }}.zip
        unzip dukpt-${{ env.DUKPT_VERSION }}-${{ matrix.os }}.zip
        sudo apt-get install -y \
          ./tr31_${{ env.TR31_VERSION }}-0ubuntu1~ppa1~${{ matrix.ubuntu_release_name }}1_amd64.deb \
          ./dukpt_${{ env.DUKPT_VERSION }}-0ubuntu1~ppa1~${{ matrix.ubuntu_release_name }}1_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual
        queries: security-and-quality

    - name: Build
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DBUILD_EMV_DECODE=YES \
          -DBUILD_EMV_TOOL=YES \
          -DBUILD_EMV_DUKPT=YES \
          -DBUILD_EMV_VIEWER=YES
        cmake --build build -j 4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

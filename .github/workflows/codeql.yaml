name: CodeQL

on:
  push:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '15 4 20 * *'

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 26.04", os: "ubuntu-26.04", ubuntu_release_name: "resolute", build_type: "Debug" }

    name: ${{ matrix.name }} build (CodeQL)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmbedtls-dev libxml2-dev libboost-locale-dev iso-codes libjson-c-dev libpcsclite-dev qt6-base-dev

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual
        queries: security-and-quality

    - name: Build
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DBUILD_EMV_DECODE=YES \
          -DBUILD_EMV_TOOL=YES \
          -DBUILD_EMV_VIEWER=YES
        cmake --build build -j 4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
